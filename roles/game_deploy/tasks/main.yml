---
- name: Mettre à jour le cache APT et installer Docker
  apt:
    name:
      - curl
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: yes

- name: Démarrer et activer le service Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Créer le répertoire de l'application sur le serveur
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Générer le fichier docker-compose.yml via le template Jinja2
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: '0644'
  become: yes

- name: Télécharger la dernière image depuis Docker Hub et lancer le conteneur
  command: docker compose pull && docker compose up -d --force-recreate
  args:
    chdir: "{{ app_dir }}"
  become: yes
